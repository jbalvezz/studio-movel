name: Gerar APK

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta o segredo KEYSTORE_BASE64 (veja o guia, passo 6)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.p12

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Mostrar erro da compilação
        if: failure()
        run: |
          { grep -E "^e: |^w: .*error" build.log; grep -A 12 "What went wrong" build.log; } | grep -v "^> Task" | head -n 60 > erro.txt || true
          msg=$(awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); gsub(/\r/,""); print}' erro.txt)
          echo "::error title=Erro de compilacao::$msg"

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk StudioMovel.apk

      - name: Publicar em Releases (link fixo para o celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.${{ github.run_number }}
          name: Studio Móvel v0.3.${{ github.run_number }}
          body: Baixe o arquivo StudioMovel.apk abaixo e instale no celular.
          files: StudioMovel.apk
          make_latest: true
